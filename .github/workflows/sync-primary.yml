
name: Sync Secondary to Primary

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    name: Mirror Repository to Primary Profile
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source repository
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Validate GitHub secret
      - name: Validate Secret Configuration
        env:
          TOKEN: ${{ secrets.PRIMARY_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PRIMARY_REPO_TOKEN is missing!"
            exit 1
          fi

          echo "GitHub token detected successfully."

      # Step 3: Push code to primary repository
      - name: Push mirror to primary repository
        env:
          TOKEN: ${{ secrets.PRIMARY_REPO_TOKEN }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w 0)" \
            push --force \
            https://github.com/DarshanGitHub123/portfolio-darshan.git \
            HEAD:main
